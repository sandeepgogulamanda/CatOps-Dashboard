<mat-card class="cat-card">
  <div class="cat-card__top">
    <div class="cat-card__avatar" aria-hidden="true">
      <mat-icon>pets</mat-icon>
    </div>

    <div class="cat-card__content">
      <p class="cat-card__name">{{ cat().name }}</p>
      <p class="cat-card__age">{{ cat().age }} yrs old</p>
    </div>
  </div>

  <p class="cat-card__description">{{ cat().description }}</p>

  <div class="cat-card__actions">
    <button
      mat-stroked-button
      type="button"
      [attr.aria-label]="'Edit ' + cat().name"
      (click)="edit.emit()"
    >
      <mat-icon>edit</mat-icon>
      Edit
    </button>

    <button
      mat-stroked-button
      type="button"
      color="warn"
      [attr.aria-label]="'Delete ' + cat().name"
      (click)="delete.emit()"
    >
      <mat-icon>delete</mat-icon>
      Delete
    </button>
  </div>
</mat-card>
